name: Validate and deploy Telegram Serverless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate JavaScript modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run validate

  deploy:
    name: Deploy to Telegram Serverless
    runs-on: ubuntu-latest
    needs: syntax
    if: github.event_name != 'pull_request'
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Skip deployment until the Telegram CLI token is configured
        if: env.TGCLOUD_TOKEN == ''
        run: echo "Deployment skipped. Add the TGCLOUD_TOKEN repository secret after enabling Serverless for the intended bot in @BotFather."
      - name: Sync and deploy validated modules safely
        if: env.TGCLOUD_TOKEN != ''
        shell: bash
        run: |
          # The Serverless project may advance between fetch and push.
          # Retry a fresh sync; never force-push over a newer remote revision.
          for attempt in 1 2 3; do
            echo "Serverless sync/deploy attempt $attempt of 3"
            npx tgcloud fetch
            if npx tgcloud push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Remote revision changed or deploy failed; retrying with a fresh snapshot."
              sleep 2
            fi
          done
          echo "Could not safely deploy after 3 attempts."
          exit 1
      - name: Apply safe database schema changes
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud migrate --safe
      - name: Synchronize Telegram webhook
        # Mantener el webhook sincronizado aunque falle una migración de la base de datos.
        if: always() && env.TGCLOUD_TOKEN != ''
        run: npx tgcloud webhook sync
